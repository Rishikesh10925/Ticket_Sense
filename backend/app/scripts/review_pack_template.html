<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Reply Labelling</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#17202e; --muted:#5b6675; --line:#d9dee6; --accent:#1f5f8b; --accent-ink:#fff; --soft:#e8f1f7; --ok:#22703f; --warn:#a33a1f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#10151d; --card:#19202b; --ink:#eef1f5; --muted:#a2adba; --line:#303a48; --accent:#7cc0ea; --accent-ink:#0c1a24; --soft:#1e3140; --ok:#79cf97; --warn:#f0997d; } }
  :root[data-theme="dark"] { --bg:#10151d; --card:#19202b; --ink:#eef1f5; --muted:#a2adba; --line:#303a48; --accent:#7cc0ea; --accent-ink:#0c1a24; --soft:#1e3140; --ok:#79cf97; --warn:#f0997d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,"Segoe UI",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:16px; }
  .narrow { max-width:780px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; overflow-wrap:anywhere; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  h1 { font-size:26px; margin:4px 0 8px; } h2 { font-size:18px; margin:18px 0 6px; }
  .tag { color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; margin-bottom:6px; }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; }
  button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:9px 14px; cursor:pointer; min-height:42px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .opt { text-align:left; flex:1 1 200px; }
  .opt.picked { border:2px solid var(--accent); background:var(--soft); font-weight:600; }
  .opt small { display:block; font-weight:400; color:var(--muted); font-size:13px; line-height:1.35; }
  .bar { height:8px; background:var(--line); border-radius:5px; overflow:hidden; flex:1; min-width:80px; }
  .bar span { display:block; height:100%; background:var(--ok); }
  @media (min-width:821px) { .evid { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; } }
  .passage { white-space:pre-wrap; font-size:14.5px; border-top:1px solid var(--line); padding:8px 6px; margin-top:8px; border-radius:6px; }
  .passage.on { background:var(--soft); outline:2px solid var(--accent); }
  ol { padding-left:1.4em; margin:6px 0; } li { margin:6px 0; }
  .cite { font:inherit; font-weight:600; color:var(--accent); background:none; border:0; padding:0 2px; min-height:0; text-decoration:underline; }
  textarea { width:100%; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bg); padding:8px; border-radius:6px; font-size:14px; margin:8px 0 0; }
  table { border-collapse:collapse; width:100%; font-size:15px; } td,th { border-top:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
  .codes label { display:inline-flex; gap:6px; margin:4px 14px 4px 0; align-items:center; }
  .need { color:var(--warn); font-size:14px; font-weight:600; }
  kbd { border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const PACK = __PACK__;
const LABELS = [["A","Acceptable","Correct, and complete enough to send as is"],
                ["M","Minor edit","Correct; small wording, order or format fixes, under two minutes"],
                ["R","Major rework","Missing key steps or has wrong steps; rewriting is faster"],
                ["W","Wrong or unsafe","Could mislead or cause harm, or uses a wrong or invented source"]];
const CODES = [["wrong_source","Wrong source"],["outdated_source","Outdated source"],["missing_step","Missing step"],["invented_step","Invented step"],
               ["did_not_address_question","Did not address the question"],["tone","Tone"],["formatting","Formatting"],["other","Other (explain in the note)"]];
const KEY = "ts-pack-" + PACK.pseudonym + "-" + PACK.pack_id;
let st = { screen:"welcome", i:0, answers:{}, alone:false };
try { const old = JSON.parse(localStorage.getItem(KEY)); if (old) st = { ...st, ...old, screen: old.screen || "items" }; } catch {}
let shownAt = Date.now(), active = true, lit = 0;
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function cur() { return PACK.items[st.i]; }
function ans(id) { return st.answers[id] || { codes: [], ms: 0 }; }
function needsNote(a) { return a.label && a.label !== "A" && a.codes.includes("other"); }
function finished(a) { return !!(a.skip || (a.label && (a.label === "A" || a.codes.length) && (!needsNote(a) || (a.note || "").trim().length >= 5))); }
function done() { return PACK.items.filter(x => finished(ans(x.assignment_id))).length; }
function tick() {  // time counts only while this ticket is on screen, at most 20 minutes per sitting
  const x = cur();
  if (st.screen === "items" && active && x) { const a = ans(x.assignment_id); a.ms = (a.ms || 0) + Math.min(1200000, Date.now() - shownAt); st.answers[x.assignment_id] = a; }
  shownAt = Date.now(); save();
}
document.addEventListener("visibilitychange", () => { tick(); active = !document.hidden; shownAt = Date.now(); });
window.addEventListener("beforeunload", tick);

function welcome() { const n = PACK.items.length, low = Math.max(1, Math.round(n * 1.5 / 60)), high = Math.max(2, Math.round(n * 2.5 / 60));
  return `<div class="narrow"><div class="card"><h1>Labelling AI support replies</h1>
    <p>Thank you for helping. You will read <b>${n} IT and HR support tickets</b>, each with a reply written by an AI, and give each reply one label. It takes roughly <b>${low} to ${high} hours</b> in total. You do not have to finish in one go: close the page whenever you like and come back later.</p>
    <h2>How it works</h2>
    <ol><li>Read the rules on the next screen (about 5 minutes).</li><li>Label the ${n} replies.</li><li>Click <b>Download my Excel file</b> and send that file back to the person who sent you this page. A partial file is fine too.</li></ol>
    <h2>Please</h2>
    <ul><li><b>Work alone.</b> Don't discuss tickets with other reviewers.</li>
      <li><b>Use your own judgement.</b> Please don't paste tickets into ChatGPT or other AI tools; we are measuring what people think.</li>
      <li><b>There are no target answers.</b> An honest "wrong" is as useful as "acceptable".</li>
      <li><b>Keep this file in one place</b> and use the same browser on a laptop or desktop: your progress is saved in that browser. It works without internet.</li></ul>
    <p class="muted">The tickets are invented, not from real people. Your answers are stored under the code ${esc(PACK.pseudonym)}, not your name. Time on each ticket is recorded.</p>
    <div class="row"><button class="primary" onclick="to('rules')">Continue</button></div></div></div>`; }
function rules() { return `<div class="narrow"><div class="card"><div class="tag">The rules (rubric ${esc(PACK.rubric_version)})</div>
  <p>Ask yourself one question: <b>could a support engineer send this reply to the user?</b></p>
  <h2>The four labels</h2>
  <table>${LABELS.map(([v,t,h]) => `<tr><td><b>${v}</b> ${t}</td><td>${h}</td></tr>`).join("")}</table>
  <p class="muted">A and M count as acceptable; R and W do not.</p>
  <h2>These always make a reply R or W</h2>
  <ol><li>A command or setting that could cause data loss, an outage or a security risk, and is not in the reference passages.</li>
    <li>A policy statement (leave, access, approval) that contradicts the passages or is not in them.</li>
    <li>An invented meaning for an error code or system message.</li>
    <li>A confident answer when key information is missing from the ticket.</li></ol>
  <h2>When the passages cannot answer the ticket</h2>
  <p>The right reply says so and asks for the missing information or hands over. That reply is <b>A</b> or <b>M</b>. A reply that answers anyway is <b>R</b> or <b>W</b>.</p>
  <h2>How to decide, step by step</h2>
  <ol><li>Read the ticket. What is the user actually asking?</li><li>Read the reply. Does it answer <i>that</i> question?</li>
    <li>Check every step against the passage it cites (click the [number]). Note steps that are not supported.</li>
    <li>Any of the four "always R or W" problems? Choose R or W and stop.</li>
    <li>Would you send it as is? <b>A</b>. After a two-minute touch-up? <b>M</b>. Otherwise <b>R</b>, or <b>W</b> if it would mislead.</li></ol>
  <h2>Examples</h2>
  <table><tr><th>Ticket</th><th>Reply</th><th>Label</th></tr>
    <tr><td>"VPN stuck on connecting at the hotel"</td><td>Explains hotel Wi-Fi may block the VPN; suggests a mobile hotspot, citing the article</td><td><b>A</b></td></tr>
    <tr><td>Same</td><td>Same steps in a confusing order, one typo</td><td><b>M</b></td></tr>
    <tr><td>Same</td><td>Tells the user to disable Windows Firewall</td><td><b>W</b> (rule 1)</td></tr>
    <tr><td>"SAP error ME023 on goods receipt"</td><td>Gives a meaning for ME023 that no passage contains</td><td><b>W</b> (rule 3)</td></tr>
    <tr><td>"Something is broken, please help"</td><td>Asks which system and what error is shown</td><td><b>A</b></td></tr></table>
  <h2>Reasons</h2>
  <p>For M, R and W, tick at least one reason. If you tick "Other", write a short note. "Skip" is only for a ticket you cannot read.</p>
  <p style="margin-top:16px"><label><input type="checkbox" ${st.alone?"checked":""} onchange="st.alone=this.checked;save();show()"> I will work alone and use my own judgement.</label></p>
  <div class="row"><button onclick="to('welcome')">Back</button><span class="grow"></span>
    <button class="primary" ${st.alone?"":"disabled"} onclick="start()">${done() ? "Back to the replies" : "Start"}</button></div></div></div>`; }
function items() {
  const x = cur(), a = ans(x.assignment_id), n = PACK.items.length, d = done(), ok = finished(a);
  const steps = x.draft.steps.map(s => `<li>${esc(s.text)} ${s.citations.map(c => `<button class="cite" title="Show passage ${c}" onclick="light(${c})">[${c}]</button>`).join(" ")}</li>`).join("");
  const why = !a.label && !a.skip ? "Choose a label" : (a.label && a.label !== "A" && !a.codes.length) ? "Tick at least one reason" : needsNote(a) && !ok ? "Write a short note for Other" : "";
  return `<div class="row" style="margin-bottom:12px"><b>Reply ${st.i + 1} of ${n}</b><div class="bar"><span style="width:${100*d/n}%"></span></div>
      <span class="muted">${d} of ${n} done</span><button onclick="to('rules')">Rules</button><button onclick="downloadXlsx()">Save Excel so far</button></div>
    <div class="grid"><div>
      <div class="card"><div class="tag">Ticket</div><b>${esc(x.ticket.subject)}</b><p style="white-space:pre-wrap;margin:6px 0 0">${esc(x.ticket.body)}</p>
        ${x.ticket.attachment_text ? `<div class="muted" style="margin-top:8px">Attachment text</div><pre>${esc(x.ticket.attachment_text)}</pre>` : ""}</div>
      <div class="card"><div class="tag">AI reply</div>
        ${x.draft.can_answer === false ? `<p><b>The reply says the passages are not enough to answer.</b></p>` : ""}
        <ol>${steps}</ol>${x.draft.missing_information.length ? `<p class="muted">The reply asks for: ${esc(x.draft.missing_information.join("; "))}</p>` : ""}
        <p class="muted">Click a [number] to highlight the passage it cites.</p></div>
    <div class="card"><b>Could a support engineer send this reply?</b>
      <div class="row" style="margin-top:8px">${LABELS.map(([v,t,h], k) => `<button class="opt ${a.label===v?"picked":""}" onclick="pick('${v}')" aria-pressed="${a.label===v}"><kbd>${k+1}</kbd> ${v}: ${t}<small>${h}</small></button>`).join("")}</div>
      <div style="margin-top:12px" class="${a.label && a.label !== "A" ? "" : "hidden"}" ${a.label && a.label !== "A" ? "" : "hidden"}><b>Reasons</b> <span class="need">(tick at least one)</span>
        <div class="codes">${CODES.map(([c,t]) => `<label><input type="checkbox" ${a.codes.includes(c)?"checked":""} onchange="code('${c}')">${t}</label>`).join("")}</div></div>
      <p class="muted" style="margin:10px 0 4px">Note ${needsNote(a) ? `<span class="need">(needed for Other)</span>` : "(optional)"}</p>
      <textarea id="note" rows="2" maxlength="2000" oninput="note(this.value)">${esc(a.note || "")}</textarea>
      <div class="row" style="margin-top:10px">
        <button onclick="go(-1)" ${st.i===0?"disabled":""}>Back</button>
        <button onclick="skip()">Skip: can't read the ticket</button><span class="grow"></span>
        <span class="muted" id="hint">${esc(why)}</span>
        <button class="primary" id="next" onclick="go(1)" ${ok ? "" : "disabled"}>${st.i === n - 1 ? "Finish" : "Next"} <kbd>Enter</kbd></button>
      </div></div>
    </div>
    <div class="card evid" id="evid"><div class="tag">Reference passages the AI was given</div>${x.evidence.length ? x.evidence.map(e => `<div class="passage ${lit===e.n?"on":""}" id="p${e.n}"><b>[${e.n}] ${esc(e.title)}</b>\n${esc(e.text)}</div>`).join("") : "<p class='muted'>None.</p>"}</div></div>`;
}
function finish() { const d = done(), n = PACK.items.length, left = PACK.items.map((x,k)=>[x,k]).filter(([x]) => !finished(ans(x.assignment_id)));
  return `<div class="narrow"><div class="card"><h1>${d===n ? "All done. Thank you!" : `${d} of ${n} done`}</h1>
    ${d===n ? `<p>One last step: download your file and send it back to the person who sent you this page, by email or WhatsApp.</p>`
            : `<p>You can send a partial file now and the rest later. Still to do: ${left.slice(0,40).map(([x,k]) => `<button onclick="st.i=${k};to('items')">${k+1}</button>`).join(" ")}${left.length>40?" …":""}</p>`}
    <div class="row"><button class="primary" onclick="downloadXlsx()">Download my Excel file</button><button onclick="st.i=${n-1};to('items')">Back to the replies</button></div>
    <p class="muted">File name: labels_${esc(PACK.pseudonym)}.xlsx, in your Downloads folder. Please don't edit it.</p></div></div>`; }
function show() { const f = { welcome, rules, items, finish }[st.screen] || welcome; document.getElementById("app").innerHTML = f(); }
function to(s) { tick(); st.screen = s; lit = 0; save(); show(); window.scrollTo(0, 0); }
function start() { const k = PACK.items.findIndex(x => !finished(ans(x.assignment_id))); if (k < 0) return to("finish"); st.i = k; to("items"); }
function upd(patch) { const x = cur(); st.answers[x.assignment_id] = { ...ans(x.assignment_id), ...patch, saved: new Date().toISOString() }; save(); }
function keep(f) {  // re-render without losing the page's or the passages panel's scroll position
  const y = window.scrollY, ev = document.getElementById("evid"), ey = ev ? ev.scrollTop : 0;
  f(); show(); window.scrollTo(0, y);
  const after = document.getElementById("evid"); if (after) after.scrollTop = ey;
}
function pick(v) { keep(() => upd({ label: v, skip: null, codes: v === "A" ? [] : ans(cur().assignment_id).codes })); }
function skip() { upd({ label: null, codes: [], skip: "unreadable" }); go(1); }
function code(c) { keep(() => { const s = new Set(ans(cur().assignment_id).codes); s.has(c) ? s.delete(c) : s.add(c); upd({ codes: [...s] }); }); }
function note(v) { upd({ note: v }); const a = ans(cur().assignment_id); document.getElementById("next").disabled = !finished(a); if (finished(a)) document.getElementById("hint").textContent = ""; }
function light(n) { keep(() => { lit = n; }); const el = document.getElementById("p" + n); if (el) el.scrollIntoView({ block: "nearest" }); }
function go(step) { tick(); const next = st.i + step;
  if (next >= PACK.items.length) return to("finish");
  st.i = Math.max(0, next); lit = 0; save(); show(); window.scrollTo(0, 0); }
document.addEventListener("keydown", e => {
  if (st.screen !== "items" || e.target.tagName === "TEXTAREA") return;
  const k = ["1","2","3","4"].indexOf(e.key);
  if (k >= 0) pick(LABELS[k][0]);
  if (e.key === "Enter" && finished(ans(cur().assignment_id))) go(1);
});

// A real .xlsx built in the page, so it works offline: a zip (stored, not compressed) of SpreadsheetML.
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files) { const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const le = (v, n) => { const a = new Uint8Array(n); for (let i = 0; i < n; i++) a[i] = (v / 2 ** (8 * i)) & 255; return a; };
  const cat = l => { const o = new Uint8Array(l.reduce((s, a) => s + a.length, 0)); let p = 0; for (const a of l) { o.set(a, p); p += a.length; } return o; };
  for (const [name, text] of files) { const nm = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const common = [le(20,2), le(0x0800,2), le(0,2), le(0,2), le(33,2), le(crc,4), le(data.length,4), le(data.length,4), le(nm.length,2), le(0,2)];
    const local = cat([le(0x04034b50,4), ...common, nm, data]);
    central.push(cat([le(0x02014b50,4), le(20,2), ...common, le(0,2), le(0,2), le(0,2), le(0,4), le(off,4), nm]));
    parts.push(local); off += local.length; }
  const dir = cat(central);
  return cat([...parts, dir, le(0x06054b50,4), le(0,2), le(0,2), le(files.length,2), le(files.length,2), le(dir.length,4), le(off,4), le(0,2)]); }
function xmlText(v) { return String(v ?? "").replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, " ").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function sheet(rows, widths) { const col = i => String.fromCharCode(65 + i);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows.map((r,y) => `<row r="${y+1}">${r.map((v,x) => typeof v === "number" ? `<c r="${col(x)}${y+1}"><v>${v}</v></c>` : `<c r="${col(x)}${y+1}" t="inlineStr"><is><t xml:space="preserve">${xmlText(v)}</t></is></c>`).join("")}</row>`).join("")}</sheetData></worksheet>`; }
function downloadXlsx() { tick();
  const rows = [["pack_id","pseudonym","assignment_id","label","reason_codes","note","skipped_reason","time_taken_ms"]];
  for (const x of PACK.items) { const a = ans(x.assignment_id); if (!finished(a)) continue;
    rows.push([PACK.pack_id, PACK.pseudonym, x.assignment_id, a.label || "", a.label && a.label !== "A" ? a.codes.join(";") : "", a.note || "", a.skip || "", Math.min(3600000, Math.round(a.ms || 0))]); }
  const data = zip([
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Labels" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml", sheet(rows, [10, 10, 38, 6, 32, 60, 14, 14])],
  ]);
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  link.download = `labels_${PACK.pseudonym}.xlsx`; document.body.appendChild(link); link.click(); link.remove();
}
show();
</script>
</body>
</html>
