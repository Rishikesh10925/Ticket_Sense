<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Reply Review</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#17202e; --muted:#5b6675; --line:#d9dee6; --accent:#1f5f8b; --accent-ink:#fff; --soft:#e8f1f7; --warn:#a33a1f; --ok:#22703f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#10151d; --card:#19202b; --ink:#eef1f5; --muted:#a2adba; --line:#303a48; --accent:#7cc0ea; --accent-ink:#0c1a24; --soft:#1e3140; --warn:#f0997d; --ok:#79cf97; } }
  :root[data-theme="dark"] { --bg:#10151d; --card:#19202b; --ink:#eef1f5; --muted:#a2adba; --line:#303a48; --accent:#7cc0ea; --accent-ink:#0c1a24; --soft:#1e3140; --warn:#f0997d; --ok:#79cf97; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,"Segoe UI",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:16px; }
  .narrow { max-width:760px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; overflow-wrap:anywhere; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  h1 { font-size:26px; margin:4px 0 8px; } h2 { font-size:18px; margin:18px 0 6px; }
  .tag { color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; margin-bottom:6px; }
  .muted { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; }
  button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:9px 14px; cursor:pointer; min-height:42px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .opt { text-align:left; flex:1 1 150px; }
  .opt.picked { border:2px solid var(--accent); background:var(--soft); font-weight:600; }
  .opt small { display:block; font-weight:400; color:var(--muted); font-size:13px; line-height:1.35; }
  .bar { height:8px; background:var(--line); border-radius:5px; overflow:hidden; flex:1; min-width:80px; }
  .bar span { display:block; height:100%; background:var(--ok); }
  .passage { white-space:pre-wrap; font-size:14.5px; border-top:1px solid var(--line); padding:8px 6px; margin-top:8px; border-radius:6px; }
  .passage.on { background:var(--soft); outline:2px solid var(--accent); }
  ol { padding-left:1.4em; margin:6px 0; } li { margin:6px 0; }
  .cite { font:inherit; font-weight:600; color:var(--accent); background:none; border:0; padding:0 2px; min-height:0; text-decoration:underline; }
  textarea { width:100%; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--bg); padding:8px; border-radius:6px; font-size:14px; margin:8px 0 0; }
  table { border-collapse:collapse; width:100%; font-size:15px; } td,th { border-top:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
  .need { color:var(--warn); font-size:14px; font-weight:600; }
  .q { margin-top:14px; } .q > b { display:block; margin-bottom:6px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const PACK = __PACK__;
const Q1 = [["A","A: Acceptable","Correct, relevant, usable as written"],["M","M: Minor edit","Small wording or format fix; facts and steps stay correct"],
            ["R","R: Major rework","Some use, but a fact or step must be corrected first"],["W","W: Wrong or unsafe","Wrong answer, wrong problem, or unsafe"],
            ["U","U: Can't determine","Not enough trustworthy information. Do not guess"]];
const Q2 = [["Fully","Fully","Every important claim and instruction is supported"],["Partially","Partially","Some support, but at least one important part has none"],
            ["Not supported","Not supported","The core lacks support or conflicts with the citations"],["Unclear","Unclear","Support cannot be checked"]];
const Q3 = [["Yes","Yes","Addresses the specific problem asked"],["No","No","A different problem, or misses the main request"],["Unclear","Unclear","Ticket or link too ambiguous to decide"]];
const KEY = "air-review-" + PACK.pack_id;
const ALL = [...PACK.practice.map(x => ({...x, practice:true})), ...PACK.items];
let st = { screen:"welcome", i:0, a:{}, alone:false };
try { st = {...st, ...(JSON.parse(localStorage.getItem(KEY)) || {})}; } catch {}
let shownAt = Date.now(), active = true, lit = 0;
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function A(x) { return st.a[x.id] || (st.a[x.id] = { ms:0 }); }
function needsReason(a) { return a.q1 && a.q2 && a.q3 && (["R","W","U"].includes(a.q1) || a.q2 !== "Fully" || a.q3 !== "Yes"); }
function finished(a) { return !!(a.q1 && a.q2 && a.q3 && (!needsReason(a) || (a.reason || "").trim().length >= 10)); }
function doneOf(list) { return list.filter(x => finished(A(x))).length; }
function tick() { // time counts only while this page is on screen, at most 20 minutes per sitting
  if (st.screen === "case" && active && ALL[st.i]) { const a = A(ALL[st.i]); a.ms = (a.ms || 0) + Math.min(1200000, Date.now() - shownAt); }
  shownAt = Date.now(); save();
}
document.addEventListener("visibilitychange", () => { tick(); active = !document.hidden; shownAt = Date.now(); });
window.addEventListener("beforeunload", tick);
function rulesHtml() { return `
  <h2>Question 1. Is this reply acceptable for this ticket?</h2>
  <table>
    <tr><td><b>A</b> Acceptable</td><td>Correct, relevant and usable as written, with no substantive correction needed.</td></tr>
    <tr><td><b>M</b> Minor edit</td><td>Usable after a small wording, formatting or clarity edit. The diagnosis, facts and required procedure stay correct.</td></tr>
    <tr><td><b>R</b> Major rework</td><td>Some useful content, but a material fact, required step, unsupported instruction or important omission must be corrected before use.</td></tr>
    <tr><td><b>W</b> Wrong or unsafe</td><td>The central answer, the problem addressed or the procedure is wrong, or following it would be unsafe. A substantially different reply is needed.</td></tr>
    <tr><td><b>U</b> Can't determine</td><td>The trustworthy information available is not enough to judge. Do not guess.</td></tr>
  </table>
  <p class="muted">Boundary rule: a correction of a fact or a procedure can never be M. Unsupported commands, policies or error-code meanings need R or W when you can establish the defect; if the reference itself cannot be verified, use U.</p>
  <h2>Question 2. Do the cited passages support the claims and instructions?</h2>
  <table>
    <tr><td><b>Fully</b></td><td>Every important claim or instruction is supported by the passages it cites.</td></tr>
    <tr><td><b>Partially</b></td><td>Some support exists, but at least one important element has none.</td></tr>
    <tr><td><b>Not supported</b></td><td>The core of the reply lacks support or conflicts with its citations.</td></tr>
    <tr><td><b>Unclear</b></td><td>Support cannot be checked.</td></tr>
  </table>
  <h2>Question 3. Does the reply address the actual problem in the ticket?</h2>
  <table>
    <tr><td><b>Yes</b></td><td>It addresses the specific problem asked.</td></tr>
    <tr><td><b>No</b></td><td>It answers a different problem or misses the main request.</td></tr>
    <tr><td><b>Unclear</b></td><td>The ticket or the link to the reply is too ambiguous to decide.</td></tr>
  </table>
  <p class="muted">A relevant answer can still be wrong, and a cited passage does not prove the passage itself is correct. Judge the three questions separately.</p>
  <h2>Example (invented, for illustration only)</h2>
  <div class="card" style="background:var(--bg)"><b>Ticket:</b> "How do I restore an accidentally deleted cloud file?"<br><b>Reply:</b> "To reset your cloud password, open Account settings and choose Reset password."<br><b>Citation:</b> a passage giving those same password-reset steps.<br><b>Answers:</b> Q1 = W, Q2 = Fully, Q3 = No. The passage supports the password steps, but the reply addresses the wrong problem.</div>
  <h2>When a reason is needed</h2>
  <p>Write a short reason for R, W or U, for anything other than "Fully" on Q2, and for "No" or "Unclear" on Q3. Point to the ticket detail or passage that decided it.</p>`; }
function welcome() { const n = PACK.items.length, low = Math.max(1, Math.round(n * 3 / 60)), high = Math.max(2, Math.round(n * 5 / 60));
  return `<div class="narrow"><div class="card"><h1>Review of AI support replies</h1>
    <p>Thank you for helping. You will read <b>${n} IT and HR support tickets</b> with a reply written by an AI, and answer three questions about each one. It takes roughly <b>${low} to ${high} hours</b> in total, and you can stop and come back.</p>
    <h2>How it works</h2>
    <ol><li>Read the rules on the next screen.</li><li>Try ${PACK.practice.length} practice tickets. They are not counted.</li><li>Do the ${n} real tickets.</li><li>Click <b>Download my Excel file</b> and send that file back to the person who sent you this page.</li></ol>
    <h2>Please</h2>
    <ul><li><b>Work alone.</b> Don't discuss tickets with other reviewers until you have sent your file.</li>
      <li><b>Use your own judgement.</b> Please don't paste tickets into ChatGPT or other AI tools. We are measuring what people think.</li>
      <li><b>There are no target answers.</b> Honest "wrong" and "can't determine" answers are just as useful as "acceptable".</li>
      <li><b>Keep this file in one place</b> and use the same browser on a laptop or desktop, because your progress is saved in that browser. It works without internet.</li></ul>
    <p class="muted">The tickets are invented, not from real people. Your answers are stored under the code ${esc(PACK.reviewer)}, not your name. Time on each ticket is recorded.</p>
    <div class="row"><button class="primary" onclick="to('rules')">Continue</button></div></div></div>`; }
function rules() { return `<div class="narrow"><div class="card"><div class="tag">The rules</div>${rulesHtml()}
    <p style="margin-top:16px"><label><input type="checkbox" ${st.alone?"checked":""} onchange="st.alone=this.checked;save();render()"> I will work alone and use my own judgement.</label></p>
    <div class="row"><button onclick="to('welcome')">Back</button><span class="grow"></span>
    <button class="primary" ${st.alone?"":"disabled"} onclick="startCases()">${doneOf(PACK.items) ? "Back to the tickets" : "Start practice"}</button></div></div></div>`; }
function opts(q, list, val) { return `<div class="row">${list.map(([v,t,h]) => `<button class="opt ${val===v?"picked":""}" onclick="pick('${q}','${v}')" aria-pressed="${val===v}">${esc(t)}<small>${esc(h)}</small></button>`).join("")}</div>`; }
function caseScreen() {
  const x = ALL[st.i], a = A(x), P = PACK.practice.length, n = PACK.items.length, d = doneOf(PACK.items);
  const label = x.practice ? `Practice ${st.i+1} of ${P}` : `Ticket ${st.i-P+1} of ${n}`;
  const steps = x.steps.map(s => `<li>${esc(s.text)} ${(s.citations||[]).map(c => `<button class="cite" title="Show passage ${c}" onclick="light(${c})">[${c}]</button>`).join(" ")}</li>`).join("");
  const reason = needsReason(a), ok = finished(a);
  return `<div class="row" style="margin-bottom:12px"><b>${label}</b><div class="bar"><span style="width:${100*d/n}%"></span></div><span class="muted">${d} of ${n} done</span>
      <button onclick="to('rules')">Rules</button><button onclick="downloadXlsx()">Save Excel so far</button></div>
    ${x.practice ? `<div class="card" style="background:var(--soft)"><b>Practice ticket.</b> This does not count. Use it to get used to the questions.</div>` : ""}
    <div class="grid"><div>
      <div class="card"><div class="tag">Ticket</div><b>${esc(x.subject)}</b><p style="white-space:pre-wrap;margin:6px 0 0">${esc(x.body)}</p>${x.attachment ? `<div class="muted" style="margin-top:8px">Attachment text</div><pre>${esc(x.attachment)}</pre>` : ""}</div>
      <div class="card"><div class="tag">AI reply</div><ol>${steps}</ol>${(x.missing||[]).length ? `<p class="muted">The reply also asks for: ${esc(x.missing.join("; "))}</p>` : ""}<p class="muted">Click a [number] to highlight the passage it cites.</p></div>
    </div>
    <div class="card"><div class="tag">Reference passages</div>${x.evidence.map(e => `<div class="passage ${lit===e.n?"on":""}" id="p${e.n}"><b>[${e.n}] ${esc(e.title)}</b>\n${esc(e.text)}</div>`).join("")}</div></div>
    <div class="card">
      <div class="q" style="margin-top:0"><b>Q1. Is the reply an acceptable response to this ticket?</b>${opts("q1",Q1,a.q1)}</div>
      <div class="q"><b>Q2. Do the cited passages support the important claims and instructions?</b>${opts("q2",Q2,a.q2)}</div>
      <div class="q"><b>Q3. Does the reply address the actual problem in the ticket?</b>${opts("q3",Q3,a.q3)}</div>
      <div class="q"><b>Reason ${reason ? `<span class="need">(needed: at least a few words)</span>` : `<span class="muted">(optional here)</span>`}</b>
        <span class="muted">Point to the ticket detail or passage that decided it.</span>
        <textarea id="reason" rows="2" maxlength="1500" oninput="note(this.value)">${esc(a.reason||"")}</textarea></div>
      <div class="row" style="margin-top:12px"><button onclick="go(-1)" ${st.i===0?"disabled":""}>Back</button><span class="grow"></span>
        <span class="muted" id="hint">${ok ? "" : "Answer all three questions" + (reason ? " and give a reason" : "")}</span>
        <button class="primary" id="next" ${ok?"":"disabled"} onclick="go(1)">${st.i===ALL.length-1?"Finish":"Next"}</button></div></div>`;
}
function pause() { return `<div class="narrow"><div class="card"><h1>Practice finished</h1><p>If any rule was unclear, ask the person who sent you this page now, before you start. Ask about the rules only, not about a specific ticket's answer.</p><p>Your answers from here on count.</p>
  <div class="row"><button onclick="st.i=${PACK.practice.length-1};to('case')">Back to practice</button><span class="grow"></span><button class="primary" onclick="st.i=${PACK.practice.length};to('case')">Start the ${PACK.items.length} tickets</button></div></div></div>`; }
function finish() { const d = doneOf(PACK.items), n = PACK.items.length, missing = PACK.items.map((x,k)=>[x,k]).filter(([x]) => !finished(A(x)));
  return `<div class="narrow"><div class="card"><h1>${d===n ? "All done. Thank you!" : `${d} of ${n} done`}</h1>
    ${d===n ? `<p>One last step: download your file and send it back to the person who sent you this page, by email or WhatsApp.</p>` : `<p>These tickets still need answers: ${missing.map(([x,k]) => `<button onclick="st.i=${k+PACK.practice.length};to('case')">${k+1}</button>`).join(" ")}</p>`}
    <div class="row"><button class="primary" onclick="downloadXlsx()">Download my Excel file</button><button onclick="st.i=${ALL.length-1};to('case')">Back to the tickets</button></div>
    <p class="muted">File name: ticketsense_ratings_${esc(PACK.reviewer)}.xlsx. It will be in your Downloads folder. Please don't edit it.</p></div></div>`; }
function render() { const f = {welcome,rules,case:caseScreen,pause,finish}[st.screen] || welcome; document.getElementById("app").innerHTML = f(); }
function to(s) { tick(); st.screen = s; lit = 0; save(); render(); window.scrollTo(0,0); }
function startCases() { const first = PACK.practice.length + doneOf(PACK.items) ? ALL.findIndex(x => !finished(A(x))) : 0; st.i = first < 0 ? ALL.length-1 : first; to(first < 0 ? "finish" : "case"); }
function pick(q,v) { const s = window.scrollY; const a = A(ALL[st.i]); a[q] = v; a.saved = new Date().toISOString(); save(); render(); window.scrollTo(0,s); }
function note(v) { const a = A(ALL[st.i]); a.reason = v; a.saved = new Date().toISOString(); save(); const ok = finished(a); document.getElementById("next").disabled = !ok; document.getElementById("hint").textContent = ok ? "" : "Answer all three questions" + (needsReason(a) ? " and give a reason" : ""); }
function light(n) { lit = n; const s = window.scrollY; render(); window.scrollTo(0,s); const el = document.getElementById("p"+n); if (el) el.scrollIntoView({block:"nearest"}); }
function go(d) { tick(); const next = st.i + d, P = PACK.practice.length;
  if (d > 0 && next === P && P) return to("pause");
  if (next >= ALL.length) return to("finish");
  st.i = Math.max(0,next); lit = 0; save(); render(); window.scrollTo(0,0); }

// A real .xlsx, built here so the page works offline: a zip (stored, not compressed) of SpreadsheetML.
const CRC = (() => { const t = []; for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i=0;i<b.length;i++) c = CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files) { const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const le = (v,n) => { const a = new Uint8Array(n); for (let i=0;i<n;i++) a[i] = (v/2**(8*i))&255; return a; };
  const cat = l => { const o = new Uint8Array(l.reduce((s,a)=>s+a.length,0)); let p=0; for (const a of l){ o.set(a,p); p+=a.length; } return o; };
  for (const [name,text] of files) { const nm = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const common = [le(20,2),le(0x0800,2),le(0,2),le(0,2),le(33,2),le(crc,4),le(data.length,4),le(data.length,4),le(nm.length,2),le(0,2)];
    const local = cat([le(0x04034b50,4),...common,nm,data]);
    central.push(cat([le(0x02014b50,4),le(20,2),...common,le(0,2),le(0,2),le(0,2),le(0,4),le(off,4),nm]));
    parts.push(local); off += local.length; }
  const dir = cat(central);
  return cat([...parts,dir,le(0x06054b50,4),le(0,2),le(0,2),le(files.length,2),le(files.length,2),le(dir.length,4),le(off,4),le(0,2)]); }
function xmlText(v) { return String(v ?? "").replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g," ").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function colName(i) { return String.fromCharCode(65+i); }
function sheet(rows, widths) { return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows.map((r,y)=>`<row r="${y+1}">${r.map((v,x)=>typeof v==="number"?`<c r="${colName(x)}${y+1}"><v>${v}</v></c>`:`<c r="${colName(x)}${y+1}" t="inlineStr"><is><t xml:space="preserve">${xmlText(v)}</t></is></c>`).join("")}</row>`).join("")}</sheetData></worksheet>`; }
function rowsFor(list) { const head = ["pack_id","reviewer","case","draft_id","finished","q1","q2","q3","reason","seconds","saved_at"];
  return [head, ...list.map((x,k) => { const a = A(x); return [PACK.pack_id,PACK.reviewer,k+1,x.id,finished(a)?"yes":"no",a.q1||"",a.q2||"",a.q3||"",a.reason||"",Math.round((a.ms||0)/1000),a.saved||""]; })]; }
function downloadXlsx() { tick(); const w = [10,9,6,38,9,5,14,9,70,8,25];
  const data = zip([
    ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`],
    ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Ratings" sheetId="1" r:id="rId1"/><sheet name="Practice" sheetId="2" r:id="rId2"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml",sheet(rowsFor(PACK.items),w)],
    ["xl/worksheets/sheet2.xml",sheet(rowsFor(PACK.practice),w)],
  ]);
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  link.download = `ticketsense_ratings_${PACK.reviewer}.xlsx`; document.body.appendChild(link); link.click(); link.remove();
}
render();
</script>
</body>
</html>
