[project]
name = "ticketsense-backend"
version = "0.1.0"
description = "TicketSense FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
# ai/ scripts: embedding generation and classifier training/inference. Kept out of the
# default install since sentence-transformers pulls in torch, which the API itself
# doesn't need for most requests — becomes core once classification is wired into the
# live request path (see backend/app/services/classification.py). See
# docs/architecture.md's "ai/ packaging" note for why this lives in
# backend/pyproject.toml rather than a separate ai/ project.
ai = ["sentence-transformers>=3.0.0", "scikit-learn>=1.5", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
