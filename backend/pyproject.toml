[project]
name = "ticketsense-backend"
version = "0.1.0"
description = "TicketSense FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    # backend/app/services/classification.py loads joblib-pickled scikit-learn
    # pipelines (ai/models/classifier.py) on every ticket creation — this is a core
    # runtime dependency now that classification is wired into the live request path,
    # not an ai/-only dev tool.
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]
# ai/ scripts and the live pipeline both need these. sentence-transformers (pulls in
# torch) and langgraph are runtime dependencies of the live request path now — the
# Week 5/6 evidence endpoint and the LangGraph pipeline both run in the background
# task on every ticket creation (see backend/Dockerfile, which installs .[ai]).
# pandas is dev-only (classifier training reads CSVs with it; nothing at runtime
# needs it), kept in the same extra for simplicity rather than a third group. See
# docs/architecture.md's "ai/ packaging" note for why this lives in
# backend/pyproject.toml rather than a separate ai/ project.
ai = ["sentence-transformers>=3.0.0", "pandas>=2.2", "langgraph>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
