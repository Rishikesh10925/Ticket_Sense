name: CI

# Lint, type checks and tests on every push and on main. There are no pull requests in
# this team's workflow (see docs/adr/001-repository-and-workflow.md), so main stays
# green by running CI on every branch push rather than by branch protection.
on:
  push:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the pushed commit range and needs full history
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uvx ruff@0.14.0 check backend ai data
      - name: Mypy (typed research packages)
        run: uvx mypy@1.18.2 --ignore-missing-imports --follow-imports=silent ai/generation/llm.py ai/evaluation
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ai-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv
          uv pip install numpy scipy pandas scikit-learn xgboost pyyaml pytest pytest-cov
      - name: ai/ unit tests (no database, no model server)
        run: .venv/bin/pytest ai/tests -q --cov=ai/evaluation --cov=ai/generation --cov-report=term

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ticketsense
          POSTGRES_PASSWORD: ticketsense
          POSTGRES_DB: ticketsense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketsense"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ticketsense:ticketsense@localhost:5432/ticketsense_test
      LLM_CLIENT: stub
      GROUNDING_SCORER: lexical
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.EasyOCR
          key: models-${{ runner.os }}-v1
      - name: Install (CPU torch first, so pip never pulls the CUDA build)
        run: |
          uv venv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[ai,dev]"
      - name: Tests
        run: .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
