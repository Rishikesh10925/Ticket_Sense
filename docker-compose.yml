services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketsense}
      POSTGRES_DB: ${POSTGRES_DB:-ticketsense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketsense} -d ${POSTGRES_DB:-ticketsense}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ticketsense}:${POSTGRES_PASSWORD:-ticketsense}@db:5432/${POSTGRES_DB:-ticketsense}
      # Local GPU model served by Ollama on the host (ADR 002).
      OLLAMA_HOST: ${OLLAMA_HOST_FROM_DOCKER:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_CLIENT: ${LLM_CLIENT:-ollama}
      GROUNDING_SCORER: ${GROUNDING_SCORER:-nli}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  db_data:
