services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketsense}
      POSTGRES_DB: ${POSTGRES_DB:-ticketsense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketsense} -d ${POSTGRES_DB:-ticketsense}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ticketsense}:${POSTGRES_PASSWORD:-ticketsense}@db:5432/${POSTGRES_DB:-ticketsense}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
